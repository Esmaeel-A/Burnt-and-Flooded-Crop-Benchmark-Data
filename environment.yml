# Environment for both pipelines (Flooded/ and Burnt/).
#
#   conda env create -f environment.yml
#   conda activate agdamage
name: agdamage
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.*
  - pandas=2.2.*
  - geopandas=0.14.*        # Flooded/01 uses the bundled naturalearth_lowres map, removed in 1.0
  - shapely=2.0.*
  - pyproj=3.6.*
  - pyarrow=20.*
  - rasterio=1.3.*
  - rioxarray=0.15.*
  - xarray=2024.*
  - dask=2024.*
  - odc-stac=0.3.*
  - odc-geo=0.4.*
  - pystac-client=0.8.*
  - rio-cogeo=5.*
  - scipy=1.17.*
  - matplotlib=3.8.*
  - earthengine-api=0.1.*
